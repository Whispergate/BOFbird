name: BOFbird Build

on:
  push:
    branches: [ main ]
    paths:
      - 'netbird/**'
      - '.github/workflows/build.yml'
      - '!**/*.md'
      - '!**/*.py'
  pull_request:
    branches: [ main ]
    paths:
      - 'netbird/**'
      - '.github/workflows/build.yml'
      - '!**/*.md'
      - '!**/*.py'
  workflow_dispatch:

env:
  GO_VERSION: '1.24.4'

jobs:
  build-cpp:
    name: C++ BOF-PE (${{ matrix.arch }})
    runs-on: ubuntu-latest
    container:
      image: ccob/windows-llvm-cross-msvc:latest
    strategy:
      # One architecture failing must not cancel the other.
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            toolchain: /opt/toolchain/x86_64-pc-windows-msvc.cmake
          - arch: i386
            toolchain: /opt/toolchain/i386-pc-windows-msvc.cmake
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Mark workspace as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and install
        working-directory: netbird
        run: |
          cmake -B build-${{ matrix.arch }} \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_TOOLCHAIN_FILE=${{ matrix.toolchain }} \
            -DBUILD_GO_TARGETS=OFF
          cmake --build build-${{ matrix.arch }} -j$(nproc)
          cmake --install build-${{ matrix.arch }}

      - name: Upload C++ artifacts
        uses: actions/upload-artifact@v6
        with:
          name: bofbird-cpp-${{ matrix.arch }}
          path: netbird/dist/

  build-go:
    name: Go daemon BOF-PE (${{ matrix.archdir }})
    # Deliberately NOT in the cross-compile image. Go + CGo + mingw-w64 is all
    # this needs, and that image does not carry the 32-bit mingw toolchain,
    # which is what broke the i386 job.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - archdir: x64
            goarch: amd64
            cc: x86_64-w64-mingw32-gcc
            cxx: x86_64-w64-mingw32-g++
            objdump: x86_64-w64-mingw32-objdump
          - archdir: x86
            goarch: "386"
            cc: i686-w64-mingw32-gcc
            cxx: i686-w64-mingw32-g++
            objdump: i686-w64-mingw32-objdump
    steps:
      - name: Checkout (with NetBird submodule)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Go
        run: |
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o "$RUNNER_TEMP/go.tar.gz"
          sudo tar -C /usr/local -xzf "$RUNNER_TEMP/go.tar.gz"
          rm -f "$RUNNER_TEMP/go.tar.gz"
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      - name: Install mingw-w64 toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64 g++-mingw-w64
          # Verify rather than assume. A silent install failure here is exactly
          # what produced a bare "i386 failed" with no compiler error.
          ${{ matrix.cc }} --version | head -1
          ${{ matrix.cxx }} --version | head -1

      - name: Build beacon compatibility layer
        working-directory: netbird
        run: |
          cmake -B build-beacon \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DBUILD_GO_TARGETS=OFF
          cmake --build build-beacon --target beacon -j$(nproc)

      - name: Resolve Go modules
        working-directory: netbird/netbirdd
        run: |
          # go.mod and go.sum are committed, so download rather than tidy.
          # tidy would rewrite both files and needs the entire module graph
          # resolvable, which makes CI depend on unrelated upstream modules.
          test -f go.mod || { echo "::error::netbirdd/go.mod missing from checkout"; exit 1; }
          test -f go.sum || { echo "::error::netbirdd/go.sum missing from checkout"; exit 1; }
          go mod download

      - name: Build daemon BOF-PE (c-shared)
        working-directory: netbird/netbirdd
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CGO_CFLAGS: -I${{ github.workspace }}/netbird/beacon
          CGO_LDFLAGS: -L${{ github.workspace }}/netbird/build-beacon/beacon
        run: |
          mkdir -p ../dist/pe ../dist/${{ matrix.archdir }}
          go build -trimpath -buildmode=c-shared -ldflags "-s -w" -tags bofpe \
            -o ../dist/pe/netbirdd.${{ matrix.archdir }}.o .
          # cgo emits a companion header next to the .o; it is not a runtime
          # artifact, so keep it out of pe/
          rm -f ../dist/pe/netbirdd.${{ matrix.archdir }}.h

      - name: Build daemon standalone exe
        working-directory: netbird/netbirdd
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          go build -trimpath -ldflags "-s -w" \
            -o ../dist/${{ matrix.archdir }}/netbirdd.exe .

      - name: Verify artifact imports beacon.dll
        working-directory: netbird
        run: |
          ls -la dist/pe/ dist/${{ matrix.archdir }}/
          ${{ matrix.objdump }} -f dist/pe/netbirdd.${{ matrix.archdir }}.o
          # A module with no beacon imports never linked the compat layer and
          # will fault at call time, so treat it as a hard failure.
          ${{ matrix.objdump }} -p dist/pe/netbirdd.${{ matrix.archdir }}.o \
            | grep -q "DLL Name: beacon.dll" \
            || { echo "::error::netbirdd.${{ matrix.archdir }}.o has no beacon.dll imports"; exit 1; }

      - name: Upload Go artifacts
        uses: actions/upload-artifact@v6
        with:
          name: bofbird-go-${{ matrix.archdir }}
          path: netbird/dist/

  merge:
    name: Merge dist
    runs-on: ubuntu-latest
    needs: [build-cpp, build-go]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Merge into single dist
        run: |
          mkdir -p dist
          # Each artifact root is netbird/dist, so merging the artifact
          # directories merges pe/, x64/, x86/ and ost/. -n keeps the first
          # copy of any shared file.
          shopt -s nullglob
          for d in artifacts/bofbird-*; do
            [ -d "$d" ] || continue
            cp -rn "$d"/. dist/
          done
          echo "=== merged dist ==="
          find dist -type f | sort

      - name: Upload merged artifact
        uses: actions/upload-artifact@v6
        with:
          name: bofbird-dist
          path: dist/

  release:
    name: Publish prerelease
    runs-on: ubuntu-latest
    needs: merge
    # Pull requests build and merge but never publish.
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Download merged dist
        uses: actions/download-artifact@v7
        with:
          name: bofbird-dist
          path: dist

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release stage/x64 stage/x86

          # beacon.dll, loader.exe and netbirdd.exe share a filename across
          # architectures, so they cannot sit loose in one release directory.
          # Bundle each architecture instead.
          cp dist/x64/beacon.dll dist/x64/loader.exe dist/x64/netbirdd.exe stage/x64/
          cp dist/x86/beacon.dll dist/x86/loader.exe dist/x86/netbirdd.exe stage/x86/
          ( cd stage/x64 && zip -qr "$GITHUB_WORKSPACE/release/bofbird-x64.zip" . )
          ( cd stage/x86 && zip -qr "$GITHUB_WORKSPACE/release/bofbird-x86.zip" . )

          # BOF-PE object files are already architecture-suffixed, so they ship
          # loose. Build-time import libraries (*.dll.a) are not shipped.
          cp dist/pe/*.o release/
          cp dist/ost/*.py release/

          ls -la release/

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="build-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"

          # A workflow re-run reuses the run number, so clear any release and
          # tag left by the previous attempt. Without this the create fails on
          # an existing tag.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi

          # No checkout in this job, so the repository must be named explicitly.
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "BOFbird build ${GITHUB_RUN_NUMBER} (${SHORT_SHA})" \
            --prerelease \
            --generate-notes
